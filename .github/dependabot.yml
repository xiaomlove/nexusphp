# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # PHP / Composer dependencies
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    commit-message:
      prefix: composer
      include: scope
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"
      filament:
        patterns:
          - "filament/*"
      sentry:
        patterns:
          - "sentry/*"
      phpunit:
        patterns:
          - "phpunit/*"
          - "mockery/*"
          - "fakerphp/*"

  # JavaScript / npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: npm
      include: scope
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "laravel-vite-plugin"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
