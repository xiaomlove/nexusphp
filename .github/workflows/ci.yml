name: CI

on:
  push:
    branches:
      - php8
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, intl, bcmath, gd, mbstring, redis, pdo_mysql, pdo_pgsql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Determine changed PHP files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mirror the exclude list from pint.json — pint honours these when
          # scanning directories, but ignores them when paths are passed explicitly,
          # so we filter changed-file paths here to keep both runs consistent.
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.php' \
            | { grep -Ev '^(bootstrap/cache|imdb|include|nexus|plugins|public|storage)/' || true; } \
            | { grep -Ev '(^|/)(_ide_helper(_models)?\.php)$' || true; } \
            | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run Pint on changed files
        if: steps.changed.outputs.files != ''
        run: vendor/bin/pint --test ${{ steps.changed.outputs.files }}

      - name: Run Pint on always-clean paths
        run: vendor/bin/pint --test tests bootstrap/app.php

  phpstan:
    name: Static analysis (PHPStan / Larastan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, intl, bcmath, gd, mbstring, redis, pdo_mysql, pdo_pgsql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, intl, bcmath, gd, mbstring, redis, pdo_mysql, pdo_pgsql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run PHPUnit (Unit suite)
        run: vendor/bin/phpunit --testsuite=Unit

  phpunit-feature:
    name: PHPUnit Feature (PHP 8.3)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: nexus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # mysqli is needed by legacy migrations that go through Nexus\Database\DBMysqli.
          extensions: gmp, intl, bcmath, gd, mbstring, redis, pdo_mysql, mysqli, pdo_pgsql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          # The .env.testing file is the source of truth for the test DB
          # config. Both Laravel's env() and the legacy nexus_env() helper
          # read it (the latter only when copied to .env), so we copy it
          # in place for both code paths.
          cp .env.testing .env
          php artisan key:generate --ansi

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL is up"; exit 0
            fi
            echo "Waiting for MySQL ($i)..."; sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Seed lookup + settings tables for legacy scripts
        run: php artisan db:seed --class=Database\\Seeders\\TestingDataSeeder --force --no-interaction

      - name: Run PHPUnit (Feature suite)
        run: vendor/bin/phpunit --testsuite=Feature
