    </linearGradient>
    <linearGradient id="nova-orange" x1="36" y1="37" x2="94" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffbf3f"/>
      <stop offset="1" stop-color="#f97316"/>
