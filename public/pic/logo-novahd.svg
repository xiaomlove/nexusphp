      <stop offset="1" stop-color="#078174"/>
    </linearGradient>
    <filter id="nova-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f3440" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#nova-shadow)">
    <path d="M64 5 105 20 123 61 106 105 64 122 21 106 5 62 22 19Z" fill="url(#nova-shield)"/>
    <path d="M64 12 100 25 115 62 100 99 64 113 28 100 13 62 28 25Z" fill="none" stroke="url(#nova-ring)" stroke-width="2.5"/>
    <path d="M34 91V35h15l33 32V35h16v56H83L50 58v33Z" fill="url(#nova-orange)"/>
    <circle cx="109" cy="53" r="3" fill="#ff9d2e"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" letter-spacing="0">
    <text x="148" y="80" fill="#123744" font-size="60" font-weight="800">Nova</text>
    <text x="361" y="80" fill="url(#nova-hd)" font-size="60" font-weight="900">HD</text>
    <rect x="151" y="91" width="274" height="4" rx="2" fill="#17b89c"/>
