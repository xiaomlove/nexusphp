<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" role="img" aria-labelledby="title desc">
  <title id="title">NovaHD</title>
  <desc id="desc">NovaHD private media archive</desc>
  <defs>
    <linearGradient id="nova-shield" x1="16" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123744"/>
      <stop offset="0.58" stop-color="#0b5960"/>
      <stop offset="1" stop-color="#08766d"/>
    </linearGradient>
    <linearGradient id="nova-ring" x1="26" y1="23" x2="105" y2="107" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8cf4e4" stop-opacity="0.82"/>
